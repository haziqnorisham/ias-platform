services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ias-backend
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - ./app_data/backend/extensions:/app/extensions
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
    networks:
      - ias-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ias-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ias-network

  redis:
    image: redis:7-alpine
    container_name: ias-redis
    restart: unless-stopped
    volumes:
      - ./app_data/redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ias-network

  postgres:
    image: postgres:18
    container_name: ias-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_USER: ias_platform_admin
      POSTGRES_DB: ias_platform_db
    ports:
      - "5432:5432"
    volumes:
      - ./app_data/postgres-data:/var/lib/postgresql
    networks:
      - ias-network

  adminer:
    image: adminer
    container_name: ias_adminer
    restart: unless-stopped
    ports:
      - "7070:8080"
    depends_on:
      - postgres
    networks:
      - ias-network

  influxdb:
    image: influxdb:2.7-alpine
    container_name: ias-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ias_admin
      DOCKER_INFLUXDB_INIT_PASSWORD: changeme
      DOCKER_INFLUXDB_INIT_ORG: ias
      DOCKER_INFLUXDB_INIT_BUCKET: ias_bucket
    ports:
      - "8086:8086"
    volumes:
      - ./app_data/influxdb-data:/var/lib/influxdb2
    networks:
      - ias-network

  lldap:
    image: lldap/lldap:stable
    container_name: ias-lldap
    restart: unless-stopped
    ports:
      - "17170:17170"
      - "3890:3890"
    environment:
      UID: 0
      GID: 0
      TZ: Asia/Kuala Lumpur
      LLDAP_JWT_SECRET: REPLACE_WITH_RANDOM
      LLDAP_KEY_SEED: REPLACE_WITH_RANDOM
      LLDAP_LDAP_BASE_DN: dc=example,dc=com
      LLDAP_LDAP_USER_PASS: changeme
    volumes:
      - ./app_data/lldap-data:/data
    networks:
      - ias-network

volumes:
  redis-data:
  postgres-data:
  influxdb-data:
  lldap-data:

networks:
  ias-network:
    driver: bridge
